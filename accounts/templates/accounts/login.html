{% extends 'main.html' %}

{% block title %}Sign in{% endblock %}

{% block content %}
    <h1>Sign in</h1>
    <div class="card" style="max-width: 28rem;">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign in</button>
        </form>
        <p>No account? <a href="{% url 'register' %}">Register</a></p>
    </div>
{% endblock %}
