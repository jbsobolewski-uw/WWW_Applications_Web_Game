{% extends 'main.html' %}
{% load socialaccount %}

{% block title %}Sign in{% endblock %}

{% block content %}
    <h1>Sign in</h1>
    <div class="card" style="max-width: 28rem;">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign in</button>
        </form>
        <ul>
            <li>No account? <a href="{% url 'register' %}">Register</a></li>
            <li>Or try logging in with <a href="{% provider_login_url 'github' %}">GitHub</a></li>
        </ul>
    </div>
{% endblock %}
