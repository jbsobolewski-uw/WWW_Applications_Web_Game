{% extends 'main.html' %}

{% block title %}Sign in{% endblock %}

{% block content %}
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign in</button>
    </form>
    <p>No account? <a href="{% url 'register' %}">Register</a></p>
{% endblock %}
