{% extends 'main.html' %}
{% load static %}

{% block extra_head %}
    <script type="module" src="{% static 'leaderboards/js/global_leaderboard.js' %}"></script>
    <link rel="stylesheet" href="{% static 'leaderboards/leaderboards.css' %}">
{% endblock %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Welcome to Hex Sweeper!</h1>

    <p><a href="{% url 'rules' %}">Read the Rulebook</a></p>

    <div class="leaderboard-wrapper">
        <div class="leaderboard-header">
            <div class="difficulty-selector">
                <label for="difficulty-select">Global Top 10:</label>
                <select id="difficulty-select">
                    {% for i in "1234567890" %}
                    <option value="{{ forloop.counter }}">Level {{ forloop.counter }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div id="global-board-container"></div>
    </div>

    <script type="module">
        const selectElement = document.getElementById('difficulty-select');
        const containerId = 'global-board-container';
        const gameSlug = 'hex_minesweeper';

        const savedDifficulty = localStorage.getItem('hex_sweeper_difficulty') || '5';
        selectElement.value = savedDifficulty;

        window.loadGlobalLeaderboard(gameSlug, parseInt(savedDifficulty), containerId);

        selectElement.addEventListener('change', (e) => {
            const newDifficulty = e.target.value;
            localStorage.setItem('hex_sweeper_difficulty', newDifficulty);
            window.loadGlobalLeaderboard(gameSlug, parseInt(newDifficulty), containerId);
        });
    </script>
{% endblock %}
