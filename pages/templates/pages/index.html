{% extends 'main.html' %}
{% load static %}

{% block extra_head %}
    <script src="{% static 'leaderboards/js/global_leaderboard.js' %}" defer></script>
{% endblock %}

{% block title %}Home page{% endblock %}

{% block content %}
    <h1>Welcome to Hex Sweeper!</h1>

    <div class="leaderboard-wrapper">
        <h3>Global Top 10 (Difficulty 5)</h3>
        <div id="global-board-container"></div>
    </div>

    <script>
        // Wait safely for the script and DOM to be ready
        document.addEventListener("DOMContentLoaded", () => {
            // Args: (game_slug, difficulty, container_id)
            window.loadGlobalLeaderboard('hex_minesweeper', 5, 'global-board-container');
        });
    </script>
{% endblock %}
