{% extends 'main.html' %}
{% load static %}

{% block title %}Play{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="{% static 'game/game.css' %}">
    <script type="module" src="{% static 'game/js/hexsweeper_main.js' %}"></script>
{% endblock %}

{% block content %}
<div class="game-page">
    <h1>Hex Sweeper</h1>

    <div class="game-controls">
        <label for="game-difficulty">Difficulty:</label>
        <select id="game-difficulty">
            <option value="1">Level 1 — Beginner</option>
            <option value="2">Level 2</option>
            <option value="3">Level 3</option>
            <option value="4">Level 4</option>
            <option value="5" selected>Level 5 — Standard</option>
            <option value="6">Level 6</option>
            <option value="7">Level 7</option>
            <option value="8">Level 8</option>
            <option value="9">Level 9</option>
            <option value="10">Level 10 — Expert</option>
        </select>
        <button id="new-game-btn" type="button">New Game</button>
    </div>

    <div class="game-stats">
        <span>Mines: <strong id="stat-mines">0</strong></span>
        <span>Flagged: <strong id="stat-flagged">0</strong></span>
        <span>Time: <strong id="stat-time">0</strong>s</span>
    </div>

    <div id="game-status"></div>

    <div id="hex-canvas-wrap">
        <canvas id="hex-canvas"></canvas>
    </div>

    <p style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--secondary); opacity: 0.6;">
        Left click — reveal &nbsp;|&nbsp; Right click — flag
    </p>
</div>
{% endblock %}
